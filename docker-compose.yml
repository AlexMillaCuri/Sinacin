services:

  wordpress:
    image: wordpress:latest
    container_name: wordpress_profesional

    ports:
      - "8080:80"

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}

      SINACIN_SMTP_HOST: ${SINACIN_SMTP_HOST}
      SINACIN_SMTP_PORT: ${SINACIN_SMTP_PORT}
      SINACIN_SMTP_USER: ${SINACIN_SMTP_USER}
      SINACIN_SMTP_PASSWORD: ${SINACIN_SMTP_PASSWORD}
      SINACIN_SMTP_FROM: ${SINACIN_SMTP_FROM}
      SINACIN_SMTP_FROM_NAME: ${SINACIN_SMTP_FROM_NAME}

    volumes:
    - ./wordpress:/var/www/html
    - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini

    depends_on:
      - db


  db:
    image: mysql:8.0
    container_name: wordpress_db

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpress_phpmyadmin

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    depends_on:
      - db


volumes:
  db_data: